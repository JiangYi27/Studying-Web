<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <title>专注时钟 · 倒计时</title>

    <!-- jQuery & FlipClock -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.10.2/jquery.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.min.js">
    </script>

    <style>
        /* ---------- 全局重置 ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 50%, #1a1a1a 0%, #0d0d0d 60%, #000000 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Microsoft YaHei', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.04;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 6px 6px;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ---------- 标题 ---------- */
        .main-title {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 24px;
            opacity: 0.7;
        }

        /* ---------- 时钟（当前时间）缩放 ---------- */
        .clock-scale {
            transform: scale(1.5);
            transform-origin: center center;
            transform-style: preserve-3d;
            margin: 6px 0 12px 0;
        }
        @media (max-width: 700px) {
            .clock-scale {
                transform: scale(1.2);
            }
        }
        @media (max-width: 480px) {
            .clock-scale {
                transform: scale(0.95);
            }
        }

        /* ---------- FlipClock 样式（极淡阴影） ---------- */
        .flip-clock-wrapper {
            width: auto;
            margin: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            perspective: 1800px;
            perspective-origin: center center;
            transform-style: preserve-3d;
        }

        .flip-clock-wrapper ul {
            float: none;
            width: 60px;
            height: 90px;
            margin: 5px;
            border-radius: 8px;
            background: #0a0a0a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.20), 0 1px 0 rgba(255, 255, 255, 0.02);
            perspective: 1800px;
            perspective-origin: center center;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .flip-clock-wrapper ul li,
        .flip-clock-wrapper ul li a {
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .flip-clock-wrapper ul li a div.up {
            transform-origin: 50% 100% 0 !important;
            backface-visibility: hidden;
        }
        .flip-clock-wrapper ul li a div.down {
            transform-origin: 50% 0% 0 !important;
            backface-visibility: hidden;
        }

        .flip-clock-wrapper ul li a div div.inn {
            color: #ececec;
            background: linear-gradient(145deg, #3a3a3a 0%, #2a2a2a 48%, #1e1e1e 52%, #2c2c2c 100%);
            border-radius: 8px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            backface-visibility: hidden;
        }

        .flip-clock-wrapper ul li a div.up::after {
            top: 44px;
            height: 3px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 1px 1px rgba(255, 255, 255, 0.02), 0 1px 2px rgba(0, 0, 0, 0.15);
        }

        /* 翻页动画（保持正确方向） */
        @-webkit-keyframes flipUpDown {
            0% {
                -webkit-transform: rotateX(0deg);
            }
            100% {
                -webkit-transform: rotateX(-90deg);
            }
        }
        @keyframes flipUpDown {
            0% {
                transform: rotateX(0deg);
            }
            100% {
                transform: rotateX(-90deg);
            }
        }
        @-webkit-keyframes flipDownUp {
            0% {
                -webkit-transform: rotateX(90deg);
            }
            100% {
                -webkit-transform: rotateX(0deg);
            }
        }
        @keyframes flipDownUp {
            0% {
                transform: rotateX(90deg);
            }
            100% {
                transform: rotateX(0deg);
            }
        }

        .flip-clock-wrapper ul.play li.flip-clock-before .up {
            -webkit-animation: flipUpDown 0.4s ease-in both !important;
            animation: flipUpDown 0.4s ease-in both !important;
        }
        .flip-clock-wrapper ul.play li.flip-clock-active .down {
            -webkit-animation: flipDownUp 0.4s 0.4s ease-out both !important;
            animation: flipDownUp 0.4s 0.4s ease-out both !important;
        }

        .flip-clock-wrapper ul li {
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* 分隔符 */
        .flip-clock-divider {
            width: 20px;
            height: 100px;
        }
        .flip-clock-divider:first-child {
            width: 0;
        }
        .flip-clock-dot {
            left: 5px;
            width: 8px;
            height: 8px;
            background: #b0b0b0;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.03), 0 1px 2px rgba(0, 0, 0, 0.15);
        }
        .flip-clock-dot.top {
            top: 29px;
        }
        .flip-clock-dot.bottom {
            bottom: 29px;
        }
        /* 隐藏AM/PM（24小时制不需要） */
        .flip-clock-meridium {
            display: none !important;
        }

        /* ---------- 金句 ---------- */
        .quote {
            margin: 28px 0 24px 0;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #b0b0b0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            padding: 0 20px;
            line-height: 1.6;
            opacity: 0.85;
        }
        .quote em {
            font-style: normal;
            color: #c8c8c8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ---------- 倒计时控制面板 ---------- */
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px 24px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 18px 30px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
            margin-top: 6px;
            width: 100%;
            max-width: 700px;
        }

        .countdown-display {
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: #ddd;
            min-width: 140px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }
        .countdown-display .unit {
            font-size: 16px;
            font-weight: 300;
            color: #888;
            margin-left: 4px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-label {
            font-size: 13px;
            color: #999;
            letter-spacing: 0.04em;
        }

        .control-input {
            width: 56px;
            padding: 6px 4px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #444;
            border-radius: 30px;
            color: #eee;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            outline: none;
            transition: border 0.2s;
        }
        .control-input:focus {
            border-color: #777;
        }
        .control-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .control-input[type="number"] {
            -moz-appearance: textfield;
        }

        .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.04em;
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            border: 1px solid #3a3a3a;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(2px);
            min-width: 60px;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #666;
            color: #fff;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: rgba(100, 180, 255, 0.12);
            border-color: #4a6a8a;
            color: #aac8ff;
        }
        .btn-primary:hover {
            background: rgba(100, 180, 255, 0.22);
            border-color: #6a9aca;
            color: #cce0ff;
        }
        .btn-danger {
            background: rgba(255, 100, 100, 0.08);
            border-color: #6a3a3a;
            color: #ffa0a0;
        }
        .btn-danger:hover {
            background: rgba(255, 100, 100, 0.18);
            border-color: #8a4a4a;
            color: #ffc0c0;
        }
        .btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .btn-icon {
            min-width: 36px;
            padding: 7px 10px;
            font-size: 18px;
            line-height: 1;
        }

        /* 全屏按钮 */
        .fullscreen-wrap {
            margin-top: 28px;
        }
        .btn-fullscreen {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #666;
            padding: 6px 18px;
            font-size: 12px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-fullscreen:hover {
            border-color: #555;
            color: #aaa;
            background: rgba(255, 255, 255, 0.02);
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 650px) {
            .control-panel {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                border-radius: 30px;
                padding: 18px 20px;
            }
            .countdown-display {
                font-size: 28px;
                min-width: auto;
            }
            .control-group {
                justify-content: center;
            }
            .quote {
                font-size: 17px;
                margin: 20px 0 18px;
            }
        }
        @media (max-width: 420px) {
            .clock-scale {
                transform: scale(0.85);
            }
            .countdown-display {
                font-size: 24px;
            }
            .btn {
                padding: 6px 14px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 标题 -->
        <div class="main-title">⏳ 专注时钟</div>

        <!-- 当前时间时钟（FlipClock） -->
        <div class="clock-scale">
            <div class="clock" id="flipclock"></div>
        </div>

        <!-- 金句 -->
        <div class="quote">“<em>专注当下，成就未来</em>”</div>

        <!-- 倒计时控制面板（集成倒计时显示） -->
        <div class="control-panel">
            <!-- 倒计时剩余时间显示 -->
            <div class="countdown-display" id="countdownDisplay">
                25:00 <span class="unit">分钟</span>
            </div>

            <!-- 设置区 -->
            <div class="control-group">
                <button class="btn btn-icon" id="btnMinus">−</button>
                <input type="number" class="control-input" id="minutesInput" value="25" min="1" max="60" />
                <button class="btn btn-icon" id="btnPlus">+</button>
                <span class="control-label" style="margin-left:4px;">分钟</span>
            </div>

            <!-- 控制按钮 -->
            <div class="control-group">
                <button class="btn btn-primary" id="btnStartPause">开始</button>
                <button class="btn btn-danger" id="btnReset">重置</button>
            </div>
        </div>

        <!-- 全屏 -->
        <div class="fullscreen-wrap">
            <button class="btn-fullscreen" id="fullscreenButton">⛶ 全屏</button>
        </div>
    </div>

    <script>
        // ---------- 1. 当前时间时钟（24小时制，显示北京时间） ----------
        let clock;
        $(function() {
            clock = $('#flipclock').FlipClock({
                clockFace: 'TwentyFourHourClock',
                showSeconds: true,
                language: 'chinese'
            });
        });

        // ---------- 2. 倒计时功能 ----------
        let countdownSeconds = 25 * 60; // 当前剩余秒数
        let totalSeconds = 25 * 60;
        let timerInterval = null;
        let isRunning = false;

        const minutesInput = document.getElementById('minutesInput');
        const btnStartPause = document.getElementById('btnStartPause');
        const btnReset = document.getElementById('btnReset');
        const btnMinus = document.getElementById('btnMinus');
        const btnPlus = document.getElementById('btnPlus');
        const countdownDisplay = document.getElementById('countdownDisplay');

        // 更新倒计时显示 (mm:ss)
        function updateCountdownDisplay(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            countdownDisplay.innerHTML = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} <span class="unit">分钟</span>`;
        }

        // 从输入框读取分钟并更新
        function syncFromInput() {
            let val = parseInt(minutesInput.value) || 1;
            val = Math.min(Math.max(val, 1), 60);
            minutesInput.value = val;
            if (!isRunning && !timerInterval) {
                countdownSeconds = val * 60;
                totalSeconds = countdownSeconds;
                updateCountdownDisplay(countdownSeconds);
            }
        }

        // 开始倒计时
        function startCountdown() {
            if (countdownSeconds <= 0) {
                syncFromInput();
            }
            if (countdownSeconds <= 0) return;

            isRunning = true;
            btnStartPause.textContent = '暂停';
            btnStartPause.classList.add('btn-primary');
            minutesInput.disabled = true;
            btnMinus.disabled = true;
            btnPlus.disabled = true;

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                countdownSeconds--;
                updateCountdownDisplay(countdownSeconds);

                if (countdownSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    isRunning = false;
                    btnStartPause.textContent = '完成';
                    btnStartPause.disabled = true;
                    minutesInput.disabled = false;
                    btnMinus.disabled = false;
                    btnPlus.disabled = false;
                    // 可播放提示音（如需）
                }
            }, 1000);
        }

        function pauseCountdown() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isRunning = false;
            btnStartPause.textContent = '继续';
            minutesInput.disabled = false;
            btnMinus.disabled = false;
            btnPlus.disabled = false;
        }

        function resetCountdown() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isRunning = false;
            const mins = parseInt(minutesInput.value) || 25;
            const validMins = Math.min(Math.max(mins, 1), 60);
            minutesInput.value = validMins;
            countdownSeconds = validMins * 60;
            totalSeconds = countdownSeconds;
            updateCountdownDisplay(countdownSeconds);
            btnStartPause.textContent = '开始';
            btnStartPause.disabled = false;
            minutesInput.disabled = false;
            btnMinus.disabled = false;
            btnPlus.disabled = false;
            btnStartPause.classList.remove('btn-primary');
        }

        // ---------- 事件绑定 ----------
        btnStartPause.addEventListener('click', function() {
            if (this.textContent === '开始' || this.textContent === '继续') {
                if (this.textContent === '开始') {
                    syncFromInput(); // 确保从输入读取最新
                }
                startCountdown();
            } else if (this.textContent === '暂停') {
                pauseCountdown();
            } else if (this.textContent === '完成') {
                resetCountdown();
            }
        });

        btnReset.addEventListener('click', resetCountdown);

        btnMinus.addEventListener('click', function() {
            if (isRunning) return;
            let val = parseInt(minutesInput.value) || 1;
            val = Math.max(val - 1, 1);
            minutesInput.value = val;
            if (!isRunning && !timerInterval) {
                countdownSeconds = val * 60;
                totalSeconds = countdownSeconds;
                updateCountdownDisplay(countdownSeconds);
            }
        });

        btnPlus.addEventListener('click', function() {
            if (isRunning) return;
            let val = parseInt(minutesInput.value) || 1;
            val = Math.min(val + 1, 60);
            minutesInput.value = val;
            if (!isRunning && !timerInterval) {
                countdownSeconds = val * 60;
                totalSeconds = countdownSeconds;
                updateCountdownDisplay(countdownSeconds);
            }
        });

        minutesInput.addEventListener('change', function() {
            let val = parseInt(this.value) || 1;
            val = Math.min(Math.max(val, 1), 60);
            this.value = val;
            if (!isRunning && !timerInterval) {
                countdownSeconds = val * 60;
                totalSeconds = countdownSeconds;
                updateCountdownDisplay(countdownSeconds);
            }
        });

        // 全屏
        const fullscreenBtn = document.getElementById('fullscreenButton');
        fullscreenBtn.addEventListener('click', async function() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                    this.textContent = '⛶ 退出全屏';
                } else {
                    await document.exitFullscreen();
                    this.textContent = '⛶ 全屏';
                }
            } catch (e) {
                console.warn('全屏不支持');
            }
        });
        document.addEventListener('fullscreenchange', function() {
            if (document.fullscreenElement) {
                fullscreenBtn.textContent = '⛶ 退出全屏';
            } else {
                fullscreenBtn.textContent = '⛶ 全屏';
            }
        });

        // 初始化倒计时显示
        updateCountdownDisplay(countdownSeconds);
    </script>

</body>
</html>
