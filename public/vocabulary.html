<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背单词 · 研习室</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --glass-bg: rgba(255, 255, 255, 0.3);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      --text-primary: #1a1d26;
      --text-secondary: rgba(26, 29, 38, 0.75);
      --text-muted: rgba(26, 29, 38, 0.55);
      --accent: #8b5cf6;
      --accent-light: rgba(139, 92, 246, 0.15);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.15);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
    }

    /* === 渐变背景 === */
    .gradient-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(135deg,
          #ffecd2 0%, #fcb69f 12%, #ff9a9e 24%, #fecfef 36%,
          #a1c4fd 48%, #c2e9fb 60%, #d4fc79 72%, #84fab0 84%, #a18cd1 100%);
      background-size: 400% 400%;
      animation: gradientShift 50s ease infinite;
    }

    .gradient-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: inherit;
      filter: blur(120px) saturate(1.2);
      opacity: 0.35;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    /* === 主应用布局 === */
    .app {
      position: relative;
      z-index: 1;
      display: flex;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
      gap: 16px;
    }

    /* === 左侧导航 === */
    .sidebar {
      width: 160px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }

    .sidebar-logo i { font-size: 20px; color: var(--accent); }
    .sidebar-logo span { font-size: 14px; font-weight: 700; }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      backdrop-filter: blur(16px);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      position: relative;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.45);
      color: var(--text-primary);
      transform: translateX(4px);
    }

    .nav-btn.active {
      background: var(--accent-light);
      border-color: rgba(139, 92, 246, 0.3);
      color: var(--accent);
    }

    .nav-btn i { font-size: 14px; width: 18px; text-align: center; }

    .nav-badge {
      position: absolute;
      right: 10px;
      min-width: 18px;
      height: 18px;
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    .sidebar-divider {
      height: 1px;
      background: rgba(255,255,255,0.2);
      margin: 6px 0;
    }

    /* === 词库选择器 === */
    .book-selector {
      margin-top: auto;
    }

    .book-selector-label {
      font-size: 10px;
      color: var(--text-muted);
      padding: 6px 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .book-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
    }

    .book-option:hover { background: rgba(255, 255, 255, 0.45); }
    .book-option.active {
      background: var(--accent-light);
      border-color: rgba(139, 92, 246, 0.3);
      color: var(--accent);
    }

    .book-option .check { margin-left: auto; display: none; }
    .book-option.active .check { display: block; }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .back-btn:hover { background: rgba(255, 255, 255, 0.45); color: var(--text-primary); }

    /* === 主内容区 === */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
      overflow: hidden;
    }

    /* === 顶部栏 === */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .top-title {
      font-size: 20px;
      font-weight: 700;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .progress-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      backdrop-filter: blur(16px);
    }

    .progress-label { font-size: 13px; color: var(--text-muted); }
    .progress-value { font-size: 14px; font-weight: 600; color: var(--accent); }

    .progress-bar {
      width: 100px;
      height: 6px;
      background: rgba(0,0,0,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* === 统计卡片 === */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      flex-shrink: 0;
    }

    .stat-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      padding: 12px 10px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .stat-card:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .stat-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .stat-icon.streak { background: var(--warning-light); color: var(--warning); }
    .stat-icon.learned { background: var(--success-light); color: var(--success); }
    .stat-icon.review { background: var(--danger-light); color: var(--danger); }
    .stat-icon.mastered { background: var(--accent-light); color: var(--accent); }

    .stat-content { display: flex; flex-direction: column; }
    .stat-value { font-size: 18px; font-weight: 700; line-height: 1.2; }
    .stat-label { font-size: 11px; color: var(--text-muted); }

    /* === 内容区 === */
    .content-area {
      flex: 1;
      display: flex;
      gap: 16px;
      min-height: 0;
      overflow: hidden;
    }

    /* === 单词卡片区 === */
    .card-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: var(--glass-shadow);
    }

    /* === 翻转卡片 === */
    .flip-card-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 350px;
    }

    .flip-card-container {
      perspective: 1200px;
      flex: 1;
      min-height: 350px;
      display: flex;
    }

    .flip-card {
      width: 100%;
      height: 100%;
      min-height: 350px;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flip-card.flipped { transform: rotateY(180deg); }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 18px;
      padding: 24px;
    }

    .flip-front {
      background: linear-gradient(145deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2));
      border: 1px solid rgba(255,255,255,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .flip-back {
      background: linear-gradient(145deg, var(--accent), #7c3aed);
      transform: rotateY(180deg);
      color: #fff;
      padding: 20px;
      overflow-y: auto;
    }

    .flip-back::-webkit-scrollbar { width: 4px; }
    .flip-back::-webkit-scrollbar-track { background: transparent; }
    .flip-back::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 2px; }

    .back-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      height: 100%;
      padding: 24px 16px;
    }

    .back-definition {
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }

    .back-example {
      text-align: center;
      padding: 16px 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      font-size: 16px;
      max-width: 90%;
    }

    .back-example-en {
      font-style: italic;
      opacity: 0.95;
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .back-example-cn {
      font-size: 15px;
      opacity: 0.8;
    }

    .back-details {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 90%;
    }

    .back-detail-group {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .back-detail-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.85;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .back-tag {
      padding: 8px 14px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      font-size: 15px;
    }

    .back-tag .tag-en { font-weight: 600; }
    .back-tag .tag-cn { font-size: 14px; opacity: 0.85; margin-left: 6px; }

    .back-memory {
      font-size: 15px;
      line-height: 1.7;
      opacity: 0.9;
    }

    .back-hint {
      text-align: center;
      font-size: 14px;
      opacity: 0.75;
      margin-top: auto;
      padding-top: 16px;
    }

    .pos-tag {
      padding: 4px 10px;
      background: var(--accent-light);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .flip-back .pos-tag { background: rgba(255,255,255,0.25); color: #fff; }

    .card-actions { display: flex; gap: 8px; }

    .card-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
    }

    .card-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }
    .flip-back .card-btn { background: rgba(255,255,255,0.2); color: #fff; }
    .flip-back .card-btn:hover { background: rgba(255,255,255,0.35); }
    .fav-btn.active { color: var(--danger) !important; }
    .flip-back .fav-btn.active { color: #ff6b6b !important; }

    .word-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .word-text { font-size: 52px; font-weight: 700; letter-spacing: -0.02em; }

    .phonetic {
      font-size: 18px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flip-back .phonetic { color: rgba(255,255,255,0.8); }

    .speak-btn {
      padding: 8px 16px;
      background: var(--accent-light);
      border: none;
      border-radius: 8px;
      color: var(--accent);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .speak-btn:hover { background: rgba(139,92,246,0.25); }
    .flip-back .speak-btn { background: rgba(255,255,255,0.25); color: #fff; }
    .flip-back .speak-btn:hover { background: rgba(255,255,255,0.35); }

    .flip-hint {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flip-back .flip-hint { color: rgba(255,255,255,0.7); }

    .def-text { font-size: 28px; font-weight: 600; text-align: center; margin: 16px 0; }

    .example-section { text-align: center; max-width: 80%; margin-top: 12px; }
    .example-en { font-size: 16px; opacity: 0.9; line-height: 1.5; font-style: italic; }
    .example-cn { font-size: 14px; opacity: 0.75; margin-top: 8px; }

    /* === 底部操作栏 === */
    .action-bar {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      padding: 16px 28px;
      background: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.1),
        inset 0 1px 0 rgba(255,255,255,0.8),
        inset 0 -1px 0 rgba(0,0,0,0.05);
      z-index: 100;
    }

    .action-btn {
      padding: 16px 40px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .action-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .action-btn:hover::before { opacity: 1; }
    .action-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .action-btn:active { transform: scale(0.97) translateY(0); }
    .action-btn i { font-size: 20px; }

    .action-btn.ignore {
      background: linear-gradient(135deg, rgba(239,68,68,0.25), rgba(239,68,68,0.15));
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.3);
    }
    .action-btn.ignore:hover { box-shadow: 0 8px 24px rgba(239,68,68,0.3); }

    .action-btn.fuzzy {
      background: linear-gradient(135deg, rgba(245,158,11,0.25), rgba(245,158,11,0.15));
      color: var(--warning);
      border: 1px solid rgba(245,158,11,0.3);
    }
    .action-btn.fuzzy:hover { box-shadow: 0 8px 24px rgba(245,158,11,0.3); }

    .action-btn.know {
      background: linear-gradient(135deg, rgba(16,185,129,0.25), rgba(16,185,129,0.15));
      color: var(--success);
      border: 1px solid rgba(16,185,129,0.3);
    }
    .action-btn.know:hover { box-shadow: 0 8px 24px rgba(16,185,129,0.3); }

    /* === 完成页 === */
    .complete-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }

    .complete-icon { font-size: 72px; margin-bottom: 24px; animation: bounceIn 0.6s ease; }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .complete-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .complete-desc { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; }

    .complete-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 32px;
    }

    .complete-stat {
      padding: 20px 28px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      min-width: 100px;
    }

    .complete-stat-num { font-size: 32px; font-weight: 700; }
    .complete-stat.c .complete-stat-num { color: var(--success); }
    .complete-stat.f .complete-stat-num { color: var(--warning); }
    .complete-stat.w .complete-stat-num { color: var(--danger); }
    .complete-stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .complete-actions { display: flex; gap: 12px; }

    .complete-btn {
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .complete-btn.primary {
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      border: none;
      color: #fff;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .complete-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(139, 92, 246, 0.5); }

    .complete-btn.secondary {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      backdrop-filter: blur(16px);
    }

    .complete-btn.secondary:hover { background: rgba(255,255,255,0.45); }

    /* === 复习/词库列表 === */
    .list-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .list-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .list-title i { color: var(--accent); }

    .list-count {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--accent-light);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 8px 14px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-tab:hover { background: rgba(255,255,255,0.4); }
    .filter-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .scrollable-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
    }

    .scrollable-list::-webkit-scrollbar { width: 6px; }
    .scrollable-list::-webkit-scrollbar-track { background: transparent; }
    .scrollable-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

    .list-item {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(16px);
      transition: all 0.2s;
    }

    .list-item:hover { background: rgba(255,255,255,0.4); transform: translateX(4px); }

    .item-word { font-size: 16px; font-weight: 600; min-width: 100px; }
    .item-phonetic { font-size: 12px; color: var(--text-muted); }
    .item-def { font-size: 14px; color: var(--text-secondary); flex: 1; }
    .item-status {
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: 500;
    }

    .item-status.new { background: var(--success-light); color: var(--success); }
    .item-status.learning { background: var(--warning-light); color: var(--warning); }
    .item-status.mastered { background: var(--accent-light); color: var(--accent); }

    .item-fav {
      padding: 8px 12px;
      background: none;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .item-fav:hover { border-color: var(--danger); color: var(--danger); }
    .item-fav.active { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }

    /* === 单词详情弹窗 === */
    .word-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .word-modal.show { display: flex; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 560px;
      max-height: 80vh;
      background: rgba(255,255,255,0.98);
      border-radius: 22px;
      backdrop-filter: blur(24px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .modal-title { font-size: 18px; font-weight: 700; }

    .modal-close {
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(0,0,0,0.05);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .modal-close:hover { background: rgba(0,0,0,0.1); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .modal-word { font-size: 36px; font-weight: 700; margin-bottom: 4px; }
    .modal-phonetic { font-size: 15px; color: var(--text-muted); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }

    .modal-section { margin-bottom: 20px; }

    .modal-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-def-box {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      padding: 16px 18px;
      background: var(--accent-light);
      border-radius: 12px;
    }

    .modal-example-box {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      padding: 14px;
      background: rgba(0,0,0,0.03);
      border-radius: 10px;
    }

    .modal-example-en { margin-bottom: 6px; font-style: italic; }
    .modal-example-cn { font-size: 14px; color: var(--text-muted); }

    .modal-phrase {
      display: flex;
      gap: 10px;
      font-size: 15px;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(0,0,0,0.06);
    }

    .modal-phrase:last-child { border-bottom: none; }
    .modal-phrase-word { font-weight: 600; color: var(--text-primary); }
    .modal-phrase-mean { color: var(--text-secondary); }

    .modal-synonym {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(0,0,0,0.04);
      border-radius: 6px;
      font-size: 14px;
      margin: 4px 8px 4px 0;
      color: var(--text-secondary);
    }

    .modal-memory {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      padding: 14px;
      background: rgba(139,92,246,0.08);
      border-radius: 10px;
      border-left: 3px solid var(--accent);
    }

    /* === 响应式 === */
    @media (max-width: 1100px) {
      .stats-panel { display: none; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .app { padding: 10px; gap: 10px; }
      .sidebar { width: 160px; }
      .word-text { font-size: 40px; }
      .def-text { font-size: 22px; }
      .action-bar { left: 16px; right: 16px; transform: none; }
      .action-btn { padding: 12px 20px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="gradient-bg"></div>
<div class="app-overlay"></div>

<div class="app">
  <!-- 左侧导航 -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-spell-check"></i>
      <span>背单词</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-btn active" data-view="learn" onclick="switchView('learn')">
        <i class="fas fa-graduation-cap"></i>
        <span>学习</span>
      </div>
      <div class="nav-btn" data-view="review" onclick="switchView('review')">
        <i class="fas fa-sync"></i>
        <span>复习</span>
        <span class="nav-badge" id="reviewBadge" style="display:none">0</span>
      </div>
      <div class="nav-btn" data-view="words" onclick="switchView('words')">
        <i class="fas fa-book-open"></i>
        <span>词库</span>
      </div>
      <div class="nav-btn" data-view="stats" onclick="switchView('stats')">
        <i class="fas fa-chart-bar"></i>
        <span>统计</span>
      </div>
    </nav>

    <div class="sidebar-divider"></div>

    <div class="book-selector">
      <div class="book-selector-label">选择词库</div>
      <div id="bookList"></div>
    </div>

    <button class="back-btn" onclick="goBack()">
      <i class="fas fa-arrow-left"></i>
      <span>返回主页</span>
    </button>
  </aside>

  <!-- 主内容区 -->
  <main class="main-area">
    <!-- 顶部栏 -->
    <div class="top-bar">
      <h1 class="top-title" id="viewTitle">学习新词</h1>
      <div class="top-right">
        <div class="progress-mini">
          <span class="progress-label">今日进度</span>
          <span class="progress-value" id="progressValue">0/15</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-icon streak"><i class="fas fa-fire"></i></div>
        <div class="stat-content">
          <div class="stat-value" id="streakNum">0</div>
          <div class="stat-label">连续打卡</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon learned"><i class="fas fa-check-circle"></i></div>
        <div class="stat-content">
          <div class="stat-value" id="learnedNum">0</div>
          <div class="stat-label">已学词数</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon review"><i class="fas fa-clock"></i></div>
        <div class="stat-content">
          <div class="stat-value" id="reviewNum">0</div>
          <div class="stat-label">待复习</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon mastered"><i class="fas fa-trophy"></i></div>
        <div class="stat-content">
          <div class="stat-value" id="masteredNum">0</div>
          <div class="stat-label">已掌握</div>
        </div>
      </div>
    </div>

    <!-- 内容区 -->
    <div class="content-area" id="contentArea">
      <!-- 动态内容 -->
    </div>
  </main>
</div>

<!-- 底部操作栏 -->
<div class="action-bar" id="actionBar" style="display:none;">
  <button class="action-btn ignore" id="btnIgnore" onclick="handleAnswer('ignore')">
    <i class="fas fa-times-circle"></i> 不认识
  </button>
  <button class="action-btn fuzzy" id="btnFuzzy" onclick="handleAnswer('fuzzy')">
    <i class="fas fa-question-circle"></i> 模糊
  </button>
  <button class="action-btn know" id="btnKnow" onclick="handleAnswer('know')">
    <i class="fas fa-check-circle"></i> 认识
  </button>
</div>

<!-- 单词详情弹窗 -->
<div class="word-modal" id="wordModal">
  <div class="modal-backdrop" onclick="closeWordModal()"></div>
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title">单词详情</span>
      <button class="modal-close" onclick="closeWordModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ========== 站点验证 ==========
  function checkSiteAccess() {
    var params = new URLSearchParams(window.location.search);
    var site = params.get('site') || '';
    if (typeof CURRENT_SITE_KEY !== 'undefined' && CURRENT_SITE_KEY !== 'grammar') return false;
    if (site === 'c') return false;
    return true;
  }

  function showSiteError() {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#ff9a9e,#a1c4fd);font-family:Inter,sans-serif;color:#1a1d26;text-align:center;padding:20px;">' +
      '<div style="background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-radius:24px;padding:48px;max-width:420px;">' +
        '<div style="font-size:64px;margin-bottom:16px;">🚫</div>' +
        '<h1 style="font-size:22px;font-weight:700;margin-bottom:10px;">背单词功能仅限英语站点</h1>' +
        '<p style="font-size:13px;opacity:0.7;margin-bottom:24px;line-height:1.6;">此功能专为英语学习设计，请从"英语语法"站点访问。</p>' +
        '<a href="/app?site=grammar" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:linear-gradient(135deg,#8b5cf6,#6366f1);border-radius:12px;color:white;text-decoration:none;font-weight:600;font-size:13px;">返回主页</a>' +
      '</div></div>';
  }

  if (!checkSiteAccess()) {
    showSiteError();
    return;
  }

  // ========== 词库配置（可扩展） ==========
  var LIST_CONFIG = {
    cet4: { name: '英语四级', file: '/English-vocabulary/四级.jsonl' },
    cet6: { name: '英语六级', file: '/English-vocabulary/六级.jsonl' },
    zsb: { name: '专升本', file: '/English-vocabulary/专升本英语.jsonl' },
    gaokao: { name: '高考词汇', file: '/English-vocabulary/高中.jsonl' }
  };

  var MAX_NEW_PER_DAY = 15;
  var SRS_INTERVALS = [1, 1, 3, 7, 14, 30];
  var MASTERY_LEVEL = 5;

  // ========== 状态 ==========
  var currentList = 'cet4';
  var currentView = 'learn';
  var wordData = [];
  var learnQueue = [];
  var reviewQueue = [];
  var currentIndex = 0;
  var isFlipped = false;
  var currentWord = null;
  var currentFilter = 'all';
  var reviewIdx = 0;

  // ========== 工具函数 ==========
  function safeJSON(str, fall) {
    if (str == null) return fall;
    try { var r = JSON.parse(str); return r == null ? fall : r; } catch(e) { return fall; }
  }
  function sg(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
  function ss(k, v) { try { localStorage.setItem(k, v); return true; } catch(e) { return false; } }

  function skey(k) { return 'vocab7_' + currentList + '_' + k; }
  function today() { return new Date().toISOString().split('T')[0]; }

  // ========== 发音 ==========
  function speak(word) {
    if ('speechSynthesis' in window) {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US';
      u.rate = 0.85;
      speechSynthesis.speak(u);
    }
  }

  // ========== 数据存储 ==========
  function loadProgress() { return safeJSON(sg(skey('progress')), {}); }

  function saveProgress(id, level, correctCount) {
    var p = loadProgress();
    if (!p[id]) p[id] = { level: 0, correctCount: 0, wrongCount: 0, lastReview: null, nextReview: null };
    p[id].level = level;
    p[id].correctCount = correctCount || 0;
    p[id].lastReview = today();
    var interval = SRS_INTERVALS[level] || 1;
    var next = new Date(); next.setDate(next.getDate() + interval);
    p[id].nextReview = next.toISOString().split('T')[0];
    ss(skey('progress'), JSON.stringify(p));
  }

  function loadStats() {
    var s = safeJSON(sg(skey('todayStats')), null);
    if (s && s.date === today()) return s;
    return { learned: 0, reviewed: 0, correct: 0, fuzzy: 0, wrong: 0 };
  }

  function saveStats(s) { s.date = today(); ss(skey('todayStats'), JSON.stringify(s)); }

  function loadCheckins() { return safeJSON(sg(skey('checkins')), {}); }

  function doCheckin() {
    var t = today();
    var cs = loadCheckins();
    if (cs[t]) return false;
    cs[t] = true; ss(skey('checkins'), JSON.stringify(cs));
    var streak = safeJSON(sg(skey('streak')), { days: 0, lastDate: null });
    var y = new Date(); y.setDate(y.getDate() - 1);
    var ys = y.toISOString().split('T')[0];
    streak.days = (streak.lastDate === ys || streak.lastDate === t) ? streak.days + 1 : 1;
    streak.lastDate = t;
    ss(skey('streak'), JSON.stringify(streak));
    return true;
  }

  function hasCheckedIn() { return !!loadCheckins()[today()]; }

  function getStreak() {
    var s = safeJSON(sg(skey('streak')), { days: 0, lastDate: null });
    var t = today();
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (s.lastDate !== y.toISOString().split('T')[0] && s.lastDate !== t) { s.days = 0; ss(skey('streak'), JSON.stringify(s)); }
    return s.days;
  }

  function loadFavs() { return safeJSON(sg(skey('favs')), []); }

  function toggleFav(id, word) {
    var fs = loadFavs();
    var i = fs.findIndex(function(f) { return f.id === id; });
    if (i >= 0) fs.splice(i, 1);
    else fs.push({ id: id, word: word.word, phonetic: word.phonetic, definition: word.definition, addedAt: today() });
    ss(skey('favs'), JSON.stringify(fs));
    return i < 0;
  }

  function isFav(id) { return loadFavs().some(function(f) { return f.id === id; }); }

  // ========== 加载词库 ==========
  async function loadWordData() {
    var cfg = LIST_CONFIG[currentList];
    if (!cfg) return;
    try {
      var r = await fetch(cfg.file);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var text = await r.text();
      var lines = text.trim().split('\n');
      wordData = [];
      for (var i = 0; i < lines.length; i++) {
        try {
          var obj = JSON.parse(lines[i]);
          var c = (obj.content && obj.content.word && obj.content.word.content) || {};
          var def = '', pos = '';
          if (c.trans && c.trans.length > 0) { def = c.trans[0].tranCn || ''; pos = c.trans[0].pos || ''; }
          if (!def && c.syno && c.syno.synos && c.syno.synos.length > 0) def = c.syno.synos[0].tran || '';
          var ex = '', exCn = '';
          if (c.sentence && c.sentence.sentences && c.sentence.sentences.length > 0) {
            ex = c.sentence.sentences[0].sContent || '';
            exCn = c.sentence.sentences[0].sCn || '';
          }
          var phrases = [];
          if (c.phrase && c.phrase.phrases) {
            for (var j = 0; j < c.phrase.phrases.length && phrases.length < 4; j++) {
              var ph = c.phrase.phrases[j];
              if (ph.pContent && ph.pCn) phrases.push({ phrase: ph.pContent, meaning: ph.pCn });
            }
          }
          var synonyms = [];
          if (c.syno && c.syno.synos) {
            for (var k = 0; k < c.syno.synos.length; k++) {
              var syno = c.syno.synos[k];
              if (syno.hwds && Array.isArray(syno.hwds)) {
                for (var l = 0; l < syno.hwds.length && synonyms.length < 6; l++) {
                  if (typeof syno.hwds[l] === 'string') synonyms.push(syno.hwds[l]);
                }
              }
              if (typeof syno === 'string' && synonyms.indexOf(syno) < 0) synonyms.push(syno);
            }
          }
          var rem = '';
          if (c.remMethod) rem = typeof c.remMethod === 'string' ? c.remMethod : (c.remMethod.val || '');
          var word = obj.headWord || '';
          if (word) wordData.push({
            id: 'w_' + (obj.wordRank || i),
            word: word,
            phonetic: c.usphone || c.phone || '',
            definition: def,
            pos: pos,
            example: ex,
            exampleCn: exCn,
            phrases: phrases,
            synonyms: synonyms,
            remMethod: rem
          });
        } catch(e) {}
      }
      console.log('[Vocab] 加载 ' + wordData.length + ' 词');
    } catch(e) {
      console.error('[Vocab] 加载失败', e);
      wordData = [];
    }
  }

  // ========== 构建队列 ==========
  function buildQueues() {
    var p = loadProgress();
    var t = today();
    var newW = [], revW = [];
    for (var i = 0; i < wordData.length; i++) {
      var w = wordData[i];
      if (!w || !w.id) continue;
      var rec = p[w.id];
      if (!rec) newW.push(w);
      else if (rec.nextReview && rec.nextReview <= t && rec.level < MASTERY_LEVEL) revW.push(w);
    }
    learnQueue = newW.slice(0, MAX_NEW_PER_DAY);
    reviewQueue = revW;
    updateBadge();
  }

  function updateBadge() {
    var b = document.getElementById('reviewBadge');
    if (b) {
      b.style.display = reviewQueue.length > 0 ? 'flex' : 'none';
      b.textContent = reviewQueue.length;
    }
  }

  // ========== 更新统计 ==========
  function updateStatsBar() {
    var p = loadProgress();
    var streak = getStreak();
    var learned = Object.keys(p).length;
    var mastered = 0;
    for (var k in p) if (p[k].level >= MASTERY_LEVEL) mastered++;
    var reviewCount = reviewQueue.length;

    document.getElementById('streakNum').textContent = streak;
    document.getElementById('learnedNum').textContent = learned;
    document.getElementById('reviewNum').textContent = reviewCount;
    document.getElementById('masteredNum').textContent = mastered;
    updateProgress();
  }

  function updateProgress() {
    var total = currentView === 'review' ? reviewQueue.length : learnQueue.length;
    var current = currentView === 'review' ? (reviewQueue.length - reviewIdx) : (currentIndex + 1);
    var percent = total > 0 ? Math.round((current - 1) / total * 100) : 0;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressValue').textContent = current + '/' + total;
  }

  // ========== 视图切换 ==========
  window.switchView = function(view) {
    currentView = view;
    document.querySelectorAll('.nav-btn').forEach(function(n) {
      n.classList.toggle('active', n.dataset.view === view);
    });

    var titles = { learn: '学习新词', review: '复习单词', words: '我的词库', stats: '学习统计' };
    document.getElementById('viewTitle').textContent = titles[view] || '背单词';

    updateStatsBar();

    if (view === 'learn') {
      document.getElementById('statsGrid').style.display = 'grid';
      renderLearn();
    } else if (view === 'review') {
      document.getElementById('statsGrid').style.display = 'grid';
      renderReview();
    } else if (view === 'words') {
      document.getElementById('statsGrid').style.display = 'grid';
      renderWords();
    } else if (view === 'stats') {
      document.getElementById('statsGrid').style.display = 'none';
      renderStats();
    }
  };

  // ========== 返回主页 ==========
  window.goBack = function() {
    var site = typeof CURRENT_SITE_KEY !== 'undefined' ? CURRENT_SITE_KEY : 'grammar';
    window.location.href = '/app?site=' + site;
  };

  // ========== 渲染词库选择器 ==========
  function renderBookSelector() {
    var html = '';
    for (var key in LIST_CONFIG) {
      html += '<div class="book-option' + (key === currentList ? ' active' : '') + '" onclick="switchBook(\'' + key + '\')">' +
        '<span>' + LIST_CONFIG[key].name + '</span>' +
        '<i class="fas fa-check check"></i></div>';
    }
    document.getElementById('bookList').innerHTML = html;
  }

  window.switchBook = function(book) {
    currentList = book;
    currentIndex = 0;
    currentFilter = 'all';
    renderBookSelector();
    loadWordData().then(function() {
      buildQueues();
      updateStatsBar();
      switchView(currentView);
    });
  };

  // ========== 学习视图 ==========
  function renderLearn() {
    document.getElementById('actionBar').style.display = 'flex';

    if (currentIndex >= learnQueue.length) {
      showComplete();
      return;
    }

    var w = learnQueue[currentIndex];
    currentWord = w;
    isFlipped = false;

    if (!hasCheckedIn()) doCheckin();
    setTimeout(function() { speak(w.word); }, 500);

    renderFlipCard(w);
    updateProgress();
  }

  function renderFlipCard(w) {
    var fav = isFav(w.id);

    // 构建背面详情
    var backDetails = '';

    if (w.phrases && w.phrases.length) {
      backDetails += '<div class="back-detail-group">' +
        '<div class="back-detail-label"><i class="fas fa-link"></i> 词组</div>' +
        '<div class="back-tags">' +
        w.phrases.map(function(p) { return '<span class="back-tag"><span class="tag-en">' + esc(p.phrase) + '</span><span class="tag-cn">' + esc(p.meaning) + '</span></span>'; }).join('') +
        '</div></div>';
    }

    if (w.synonyms && w.synonyms.length) {
      backDetails += '<div class="back-detail-group">' +
        '<div class="back-detail-label"><i class="fas fa-exchange-alt"></i> 同义词</div>' +
        '<div class="back-tags">' +

  // ========== 复习视图 ==========
  function renderReview() {
    buildQueues();
    updateStatsBar();
    document.getElementById('actionBar').style.display = 'flex';

    if (reviewQueue.length === 0) {
      var streak = getStreak();
      document.getElementById('actionBar').style.display = 'none';
      document.getElementById('contentArea').innerHTML =
        '<div class="glass-card list-section">' +
          '<div class="list-header"><span class="list-title"><i class="fas fa-check-circle"></i> 今日复习已完成</span></div>' +
          '<div class="complete-page">' +
            '<div class="complete-icon">✨</div>' +
            '<div class="complete-title">太棒了！</div>' +
            '<div class="complete-desc">连续打卡 ' + streak + ' 天，没有需要复习的单词</div>' +
            '<div class="complete-actions"><button class="complete-btn primary" onclick="switchView(\'learn\')"><i class="fas fa-book"></i> 去学新词</button></div>' +
          '</div>' +
        '</div>';
      return;
    }

    var html = '<div class="card-section"><div class="glass-card list-section">' +
      '<div class="list-header"><span class="list-title"><i class="fas fa-sync"></i> 今日待复习</span><span class="list-count">' + reviewQueue.length + ' 词</span></div>' +
      '<div class="scrollable-list">';

    var p = loadProgress();
    for (var i = 0; i < reviewQueue.length; i++) {
      var w = reviewQueue[i];
      var rec = p[w.id] || {};
      var lv = rec.level || 0;
      var cls = lv >= MASTERY_LEVEL ? 'mastered' : lv > 0 ? 'learning' : 'new';
      var txt = lv >= MASTERY_LEVEL ? '已掌握' : lv > 0 ? '学习中' : '新词';
      html += '<div class="list-item" onclick="showReviewCard(' + i + ')">' +
        '<div><div class="item-word">' + esc(w.word) + '</div><div class="item-phonetic">/' + esc(w.phonetic || '') + '/</div></div>' +
        '<div class="item-def">' + esc(w.definition) + '</div>' +
        '<span class="item-status ' + cls + '">' + txt + '</span></div>';
    }
    html += '</div></div></div>';
    document.getElementById('contentArea').innerHTML = html;
  }

  function showReviewCard(idx) {
    reviewIdx = idx;
    var w = reviewQueue[idx];
    if (!w) return;
    currentWord = w;
    isFlipped = false;
    setTimeout(function() { speak(w.word); }, 300);
    renderFlipCard(w);
    updateProgress();
  }

  // ========== 词库视图 ==========
  function renderWords() {
    var p = loadProgress();
    var fs = loadFavs();
    var favIds = {};
    for (var fi = 0; fi < fs.length; fi++) favIds[fs[fi].id] = true;

    var words = wordData;
    if (currentFilter === 'new') words = wordData.filter(function(w) { return !p[w.id]; });
    else if (currentFilter === 'learning') words = wordData.filter(function(w) { var r = p[w.id]; return r && r.level < MASTERY_LEVEL && r.level > 0; });
    else if (currentFilter === 'mastered') words = wordData.filter(function(w) { var r = p[w.id]; return r && r.level >= MASTERY_LEVEL; });
    else if (currentFilter === 'fav') words = wordData.filter(function(w) { return favIds[w.id]; });

    var all = wordData.length;
    var nw = wordData.length - Object.keys(p).length;
    var lc = 0, mc = 0;
    for (var k in p) { if (p[k].level >= MASTERY_LEVEL) mc++; else if (p[k].level > 0) lc++; }

    var html = '<div class="glass-card list-section" style="flex:1;display:flex;">' +
      '<div class="list-header"><span class="list-title"><i class="fas fa-book-open"></i> 我的词库</span><span class="list-count">' + words.length + ' 词</span></div>' +
      '<div class="filter-tabs">' +
        '<div class="filter-tab' + (currentFilter === 'all' ? ' active' : '') + '" onclick="setFilter(\'all\')">全部 ' + all + '</div>' +
        '<div class="filter-tab' + (currentFilter === 'new' ? ' active' : '') + '" onclick="setFilter(\'new\')">新词 ' + nw + '</div>' +
        '<div class="filter-tab' + (currentFilter === 'learning' ? ' active' : '') + '" onclick="setFilter(\'learning\')">学习中 ' + lc + '</div>' +
        '<div class="filter-tab' + (currentFilter === 'mastered' ? ' active' : '') + '" onclick="setFilter(\'mastered\')">已掌握 ' + mc + '</div>' +
        '<div class="filter-tab' + (currentFilter === 'fav' ? ' active' : '') + '" onclick="setFilter(\'fav\')">收藏 ' + fs.length + '</div>' +
      '</div>' +
      '<div class="scrollable-list">';

    if (words.length === 0) {
      html += '<div style="text-align:center;padding:48px;color:var(--text-muted);">暂无单词</div>';
    } else {
      for (var i = 0; i < words.length; i++) {
        var w = words[i];
        var rec = p[w.id] || {};
        var lv = rec.level || 0;
        var cls = lv >= MASTERY_LEVEL ? 'mastered' : lv > 0 ? 'learning' : 'new';
        var txt = lv >= MASTERY_LEVEL ? '已掌握' : lv > 0 ? '学习中' : '新词';
        var isF = !!favIds[w.id];
        html += '<div class="list-item">' +
          '<div style="flex:1;min-width:0;cursor:pointer;" onclick="showWordDetail(\'' + w.id + '\')"><div class="item-word">' + esc(w.word) + '</div><div class="item-phonetic">/' + esc(w.phonetic || '') + '/</div></div>' +
          '<div class="item-def" onclick="showWordDetail(\'' + w.id + '\')">' + esc(w.definition) + '</div>' +
          '<span class="item-status ' + cls + '">' + txt + '</span>' +
          '<button class="item-fav' + (isF ? ' active' : '') + '" onclick="event.stopPropagation();toggleWordFav(\'' + w.id + '\')"><i class="' + (isF ? 'fas' : 'far') + ' fa-heart"></i></button></div>';
      }
    }
    html += '</div></div>';
    document.getElementById('contentArea').innerHTML = html;
    document.getElementById('actionBar').style.display = 'none';
  }

  window.setFilter = function(f) {
    currentFilter = f;
    renderWords();
  };

  window.toggleWordFav = function(id) {
    var w = wordData.find(function(x) { return x.id === id; });
    if (w) {
      var added = toggleFav(id, w);
      var btn = event.target.closest('.item-fav');
      if (btn) {
        btn.classList.toggle('active', added);
        btn.querySelector('i').className = added ? 'fas fa-heart' : 'far fa-heart';
      }
    }
  };

  // ========== 统计视图 ==========
  function renderStats() {
    var p = loadProgress();
    var total = Object.keys(p).length;
    var mastered = 0, learning = 0, newWords = wordData.length - total;
    for (var k in p) {
      if (p[k].level >= MASTERY_LEVEL) mastered++;
      else if (p[k].level > 0) learning++;
    }

    // 获取最近7天的学习数据
    var weekData = [];
    for (var d = 6; d >= 0; d--) {
      var date = new Date();
      date.setDate(date.getDate() - d);
      var dateStr = date.toISOString().split('T')[0];
      var dayStats = safeJSON(sg(skey('dayStats_' + dateStr)), { learned: 0 });
      var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
      weekData.push({
        day: dayNames[date.getDay()],
        count: dayStats.learned || 0,
        isToday: d === 0
      });
    }

    var maxCount = Math.max.apply(null, weekData.map(function(w) { return w.count; })) || 1;

    // 计算今日和本周数据
    var todayStats = loadStats();
    var weekTotal = weekData.reduce(function(sum, d) { return sum + d.count; }, 0);
    var avgPerDay = Math.round(weekTotal / 7);
    var accuracy = todayStats.learned > 0 ? Math.round((todayStats.correct / todayStats.learned) * 100) : 0;

    // 计算预计完成天数
    var remainingWords = wordData.length - total;
    var daysLeft = avgPerDay > 0 ? Math.ceil(remainingWords / avgPerDay) : '--';

    var html =
      '<div class="glass-card" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">' +
        '<div class="list-header"><span class="list-title"><i class="fas fa-chart-bar"></i> 学习数据统计</span></div>' +
        '<div style="padding:20px;display:flex;flex-direction:column;gap:20px;flex:1;overflow-y:auto;">' +

          // 今日数据概览
          '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">' +
            '<div class="stat-card">' +
              '<div class="stat-icon learned"><i class="fas fa-graduation-cap"></i></div>' +
              '<div class="stat-content"><div class="stat-value" style="color:var(--accent);">' + todayStats.learned + '</div><div class="stat-label">今日学习</div></div>' +
            '</div>' +
            '<div class="stat-card">' +
              '<div class="stat-icon" style="background:var(--accent-light);color:var(--accent);"><i class="fas fa-chart-line"></i></div>' +
              '<div class="stat-content"><div class="stat-value">' + avgPerDay + '</div><div class="stat-label">日均学习</div></div>' +
            '</div>' +
            '<div class="stat-card">' +
              '<div class="stat-icon mastered"><i class="fas fa-trophy"></i></div>' +
              '<div class="stat-content"><div class="stat-value" style="color:var(--success);">' + mastered + '</div><div class="stat-label">已掌握</div></div>' +
            '</div>' +
            '<div class="stat-card">' +
              '<div class="stat-icon" style="background:var(--success-light);color:var(--success);"><i class="fas fa-percentage"></i></div>' +
              '<div class="stat-content"><div class="stat-value" style="color:var(--success);">' + accuracy + '%</div><div class="stat-label">正确率</div></div>' +
            '</div>' +
          '</div>' +

          // 学习进度条
          '<div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:20px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
              '<div style="font-size:14px;font-weight:600;">📊 ' + LIST_CONFIG[currentList].name + ' 学习进度</div>' +
              '<div style="font-size:13px;color:var(--text-muted);">' + total + ' / ' + wordData.length + ' 词</div>' +
            '</div>' +
            '<div style="height:12px;background:rgba(0,0,0,0.1);border-radius:6px;overflow:hidden;display:flex;">' +
              '<div style="width:' + (wordData.length > 0 ? (mastered/wordData.length*100).toFixed(1) : 0) + '%;background:linear-gradient(90deg,var(--success),#34d399);transition:width 0.3s;"></div>' +
              '<div style="width:' + (wordData.length > 0 ? (learning/wordData.length*100).toFixed(1) : 0) + '%;background:linear-gradient(90deg,var(--warning),#fbbf24);transition:width 0.3s;"></div>' +
            '</div>' +
            '<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--text-muted);">' +
              '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--success);margin-right:4px;vertical-align:middle;"></span>已掌握 ' + mastered + ' 词</span>' +
              '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--warning);margin-right:4px;vertical-align:middle;"></span>学习中 ' + learning + ' 词</span>' +
              '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:rgba(0,0,0,0.15);margin-right:4px;vertical-align:middle;"></span>未学 ' + (wordData.length - total) + ' 词</span>' +
            '</div>' +
          '</div>' +

          // 近7天柱状图
          '<div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:20px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
              '<div style="font-size:14px;font-weight:600;">📈 近7天学习趋势</div>' +
              '<div style="font-size:12px;color:var(--text-muted);">本周学习 ' + weekTotal + ' 词</div>' +
            '</div>' +
            '<div style="display:flex;align-items:flex-end;justify-content:space-around;height:100px;padding:10px 0;">' +
              weekData.map(function(w) {
                var h = w.count > 0 ? Math.max(8, (w.count / maxCount) * 70) : 4;
                return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">' +
                  '<div style="width:32px;height:' + h + 'px;background:' + (w.isToday ? 'linear-gradient(180deg,var(--accent),#a78bfa)' : 'var(--accent-light)') + ';border-radius:6px 6px 0 0;transition:height 0.3s;" title="' + w.count + '词"></div>' +
                  '<span style="font-size:11px;' + (w.isToday ? 'color:var(--accent);font-weight:600;' : 'color:var(--text-muted);') + '">' + w.day + '</span>' +
                '</div>';
              }).join('') +
            '</div>' +
          '</div>' +

          // 今日详情 + 记忆曲线
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">' +
            // 今日答题情况
            '<div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:18px;">' +
              '<div style="font-size:14px;font-weight:600;margin-bottom:14px;">📝 今日答题</div>' +
              '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;">' +
                '<div><div style="font-size:24px;font-weight:700;color:var(--success);">' + todayStats.correct + '</div><div style="font-size:11px;color:var(--text-muted);">认识</div></div>' +
                '<div><div style="font-size:24px;font-weight:700;color:var(--warning);">' + todayStats.fuzzy + '</div><div style="font-size:11px;color:var(--text-muted);">模糊</div></div>' +
                '<div><div style="font-size:24px;font-weight:700;color:var(--danger);">' + todayStats.wrong + '</div><div style="font-size:11px;color:var(--text-muted);">不认识</div></div>' +
              '</div>' +
            '</div>' +
            // 记忆曲线
            '<div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:18px;">' +
              '<div style="font-size:14px;font-weight:600;margin-bottom:14px;">🧠 间隔重复</div>' +
              '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                '<div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);">' +
                  '<i class="fas fa-clock" style="color:var(--accent);"></i> 完成剩余约 <span style="font-weight:600;color:var(--accent);">' + daysLeft + '</span> 天' +
                '</div>' +
              '</div>' +
              '<div style="display:flex;gap:6px;margin-top:12px;">' +
                '<div style="flex:1;padding:8px;background:var(--accent-light);border-radius:6px;text-align:center;font-size:11px;"><div style="font-weight:600;color:var(--accent);">1天</div>第1轮</div>' +
                '<div style="flex:1;padding:8px;background:var(--accent-light);border-radius:6px;text-align:center;font-size:11px;"><div style="font-weight:600;color:var(--accent);">3天</div>第2轮</div>' +
                '<div style="flex:1;padding:8px;background:var(--accent-light);border-radius:6px;text-align:center;font-size:11px;"><div style="font-weight:600;color:var(--accent);">7天</div>第3轮</div>' +
                '<div style="flex:1;padding:8px;background:var(--accent-light);border-radius:6px;text-align:center;font-size:11px;"><div style="font-weight:600;color:var(--accent);">14天</div>第4轮</div>' +
                '<div style="flex:1;padding:8px;background:var(--success-light);border-radius:6px;text-align:center;font-size:11px;"><div style="font-weight:600;color:var(--success);">掌握</div></div>' +
              '</div>' +
            '</div>' +
          '</div>' +

        '</div>' +
      '</div>';

    document.getElementById('contentArea').innerHTML = html;
  }

  // ========== 单词详情弹窗 ==========
  window.showWordDetail = function(id) {
    var w = wordData.find(function(x) { return x.id === id; });
    if (!w) return;

    var html = '<div class="modal-word">' + esc(w.word) + '</div>';
    html += '<div class="modal-phonetic">/' + esc(w.phonetic || '') + '/ <i class="fas fa-volume-up" style="cursor:pointer;" onclick="speak(\'' + esc(w.word) + '\')"></i></div>';
    if (w.pos) html += '<div style="font-size:13px;color:var(--accent);margin-bottom:16px;">' + esc(w.pos) + '</div>';

    html += '<div class="modal-section"><div class="modal-section-title"><i class="fas fa-book"></i> 释义</div><div class="modal-def-box">' + esc(w.definition) + '</div></div>';

    if (w.example) {
      html += '<div class="modal-section"><div class="modal-section-title"><i class="fas fa-quote-left"></i> 例句</div><div class="modal-example-box"><div class="modal-example-en">' + esc(w.example) + '</div><div class="modal-example-cn">' + esc(w.exampleCn) + '</div></div></div>';
    }

    if (w.phrases && w.phrases.length) {
      html += '<div class="modal-section"><div class="modal-section-title"><i class="fas fa-link"></i> 词组</div>';
      for (var i = 0; i < w.phrases.length; i++) {
        html += '<div class="modal-phrase"><span class="modal-phrase-word">' + esc(w.phrases[i].phrase) + '</span><span class="modal-phrase-mean">' + esc(w.phrases[i].meaning) + '</span></div>';
      }
      html += '</div>';
    }

    if (w.synonyms && w.synonyms.length) {
      html += '<div class="modal-section"><div class="modal-section-title"><i class="fas fa-exchange-alt"></i> 同义词</div>';
      for (var j = 0; j < w.synonyms.length; j++) {
        html += '<span class="modal-synonym">' + esc(w.synonyms[j]) + '</span>';
      }
      html += '</div>';
    }

    if (w.remMethod) {
      html += '<div class="modal-section"><div class="modal-section-title"><i class="fas fa-lightbulb"></i> 记忆法</div><div class="modal-memory">' + esc(w.remMethod) + '</div></div>';
    }

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('wordModal').classList.add('show');
  };

  window.closeWordModal = function() {
    document.getElementById('wordModal').classList.remove('show');
  };

  // ========== 翻转与发音 ==========
  window.flip = function() {
    isFlipped = !isFlipped;
    var c = document.getElementById('flipCard');
    if (c) c.classList.toggle('flipped', isFlipped);
  };

  window.speakCurrent = function() {
    if (currentWord) speak(currentWord.word);
  };

  window.toggleFavBtn = function() {
    if (!currentWord) return;
    var added = toggleFav(currentWord.id, currentWord);
    var btn = document.querySelector('.fav-btn');
    if (btn) {
      btn.classList.toggle('active', added);
      btn.querySelector('i').className = added ? 'fas fa-heart' : 'far fa-heart';
    }
  };

  // ========== 答题 ==========
  window.handleAnswer = function(type) {
    if (!isFlipped) {
      flip();
      return;
    }

    if (currentView === 'learn') answerLearn(type);
    else if (currentView === 'review') answerReviewFn(type);
  };

  function answerLearn(type) {
    if (!currentWord) return;
    var p = loadProgress();
    var rec = p[currentWord.id] || { level: 0, correctCount: 0 };
    var level = rec.level || 0;
    var correctCount = rec.correctCount || 0;
    var s = loadStats();
    s.learned++;

    if (type === 'know') { s.correct++; correctCount++; level = Math.min(level + 1, MASTERY_LEVEL); }
    else if (type === 'fuzzy') { s.fuzzy++; }
    else { s.wrong++; correctCount = 0; }

    saveStats(s);
    saveProgress(currentWord.id, level, correctCount);

    // 记录每日统计
    var dayKey = 'dayStats_' + today();
    var dayStats = safeJSON(sg(skey(dayKey)), { learned: 0 });
    dayStats.learned++;
    ss(skey(dayKey), JSON.stringify(dayStats));

    currentIndex++;
    isFlipped = false;
    updateStatsBar();

    if (currentIndex >= learnQueue.length) renderLearn();
    else {
      var w = learnQueue[currentIndex];
      currentWord = w;
      setTimeout(function() { speak(w.word); }, 400);
      renderFlipCard(w);
      updateProgress();
    }
  }

  function answerReviewFn(type) {
    var w = currentWord;
    if (!w) return;
    var p = loadProgress();
    var rec = p[w.id] || { level: 0 };
    var level = rec.level || 0;
    var correctCount = rec.correctCount || 0;
    var s = loadStats();
    s.reviewed++;

    if (type === 'know') { s.correct++; correctCount++; level = Math.min(level + 1, MASTERY_LEVEL); }
    else if (type === 'fuzzy') { s.fuzzy++; }
    else { s.wrong++; correctCount = 0; level = 0; }

    saveStats(s);
    saveProgress(w.id, level, correctCount);

    reviewQueue.splice(reviewIdx, 1);
    updateBadge();
    updateStatsBar();
    isFlipped = false;

    if (reviewQueue.length === 0) renderReview();
    else {
      var nextIdx = Math.min(reviewIdx, reviewQueue.length - 1);
      var nextW = reviewQueue[nextIdx];
      currentWord = nextW;
      reviewIdx = nextIdx;
      setTimeout(function() { speak(nextW.word); }, 400);
      renderFlipCard(nextW);
      updateProgress();
    }
  }

  window.continueLearning = function() {
    if (learnQueue.length === 0 || currentIndex >= learnQueue.length) {
      loadWordData().then(function() {
        buildQueues();
        currentIndex = 0;
        renderLearn();
      });
    } else {
      renderLearn();
    }
  };

  // ========== 辅助函数 ==========
  function esc(str) {
    if (typeof str !== 'string') return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ========== 键盘快捷键 ==========
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); flip(); }
    else if (e.code === 'Digit1' || e.code === 'Numpad1' || e.code === 'ArrowLeft') handleAnswer('ignore');
    else if (e.code === 'Digit2' || e.code === 'Numpad2' || e.code === 'ArrowDown') handleAnswer('fuzzy');
    else if (e.code === 'Digit3' || e.code === 'Numpad3' || e.code === 'ArrowRight') handleAnswer('know');
    else if (e.code === 'KeyP') speakCurrent();
  });

  // ========== 初始化 ==========
  renderBookSelector();
  loadWordData().then(function() {
    buildQueues();
    updateStatsBar();
    switchView('learn');
  });

})();
</script>
