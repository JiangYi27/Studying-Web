<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研习室 · 管理后台</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root {
      --ink: #152238;
      --muted: #667085;
      --white: #ffffff;
      --line: #dce1e5;
      --orange: #f26b4f;
      --orange-dark: #dc573d;
      --teal: #2b8c88;
      --teal-light: rgba(43, 140, 136, 0.12);
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Serif SC', serif;
      background: linear-gradient(135deg, #0f1923 0%, #1a2744 50%, #0d4a4a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 背景装饰 */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(43, 140, 136, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 60%, rgba(242, 107, 79, 0.1) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes bgShift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-2%, 2%); }
    }

    .login-panel {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .login-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--teal), var(--orange));
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--teal), var(--orange));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(43, 140, 136, 0.3);
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 13px;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
    }

    .input-wrap {
      position: relative;
      width: 100%;
    }

    .input-wrap input {
      width: 100%;
      height: 48px;
      padding: 0 14px 0 44px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: var(--white);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 200ms, box-shadow 200ms;
    }

    .input-wrap input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-light);
    }

    .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 16px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      transition: color 200ms;
    }

    .password-toggle:hover {
      color: var(--ink);
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 200ms ease;
      box-shadow: 0 4px 16px rgba(242, 107, 79, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(242, 107, 79, 0.45);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      color: var(--red);
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      transition: color 200ms;
    }

    .back-link:hover {
      color: var(--teal);
    }
  </style>
</head>
<body>
  <div class="login-panel">
    <div class="login-header">
      <div class="logo">
        <i class="fas fa-shield-alt"></i>
      </div>
      <h1>管理后台</h1>
      <p>研习室 · 管理员登录</p>
    </div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label>管理员账号</label>
        <div class="input-wrap">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="username" placeholder="请输入管理员账号" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label>密码</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="togglePassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <i class="fas fa-sign-in-alt"></i>
        <span>登 录</span>
      </button>
    </form>

    <a href="/" class="back-link">
      <i class="fas fa-arrow-left"></i> 返回学习平台
    </a>
  </div>

  <script>
    const form = document.getElementById('adminLoginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    // 密码显示/隐藏
    togglePassword.addEventListener('click', function() {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      this.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    // 登录表单提交
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorMsg.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.success) {
          // 登录成功，跳转后台主页
          window.location.href = '/admin/index.html';
        } else {
          errorMsg.textContent = data.error || '登录失败，请检查账号密码';
          errorMsg.classList.add('show');
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请稍后重试';
        errorMsg.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>登 录</span>';
      }
    });
  </script>
</body>
</html>
