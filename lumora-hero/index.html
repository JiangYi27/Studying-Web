<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研习室 — 把每一门语言，学出条理</title>

  <!-- Tailwind CSS (CDN play: 即时编译任意值) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Instrument Serif (logo 斜体) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">

  <style>
    html, body {
      font-family: 'Noto Serif SC', ui-serif, 'Songti SC', 'SimSun', serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-body {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    /* 仅英文/衬线点缀用 Instrument Serif（中文走 Noto Serif SC） */
    .serif-accent {
      font-family: 'Instrument Serif', 'Georgia', serif;
    }

    /* ===== 背景视频层 ===== */
    .video-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1000ms ease-in-out;
    }
    .video-bg.active { opacity: 1; }

    /* ===== 透明 PNG overlay: 轻微上下浮动 (train-bob) ===== */
    @keyframes trainBob {
      0%, 100% { transform: translateY(0) scale(1.03); }
      50%      { transform: translateY(-6px) scale(1.03); }
    }
    .train-bob { animation: trainBob 3s ease-in-out infinite; }

    /* ===== 液态玻璃 (.liquid-glass) ===== */
    .liquid-glass {
      position: relative;
      background: rgba(255, 255, 255, 0.01);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10),
                  inset 0 0 18px rgba(255, 255, 255, 0.05);
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(135deg, rgba(255,255,255,0.65), rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.5));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
              mask-composite: exclude;
      pointer-events: none;
    }

    /* ===== 视频切换按钮 ===== */
    .vtab {
      transition: color 300ms ease, border-color 300ms ease, opacity 300ms ease;
    }
    .vtab.active {
      color: #fff;
      border-bottom: 1px solid #fff;
    }
    .vtab:not(.active) {
      opacity: 0.5;
      border-bottom: 1px solid transparent;
    }
    .vtab:not(.active):hover { opacity: 0.8; }

    /* ===== 汉堡按钮: Menu / X 300ms 旋转交叠 ===== */
    .hamburger svg {
      transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1), opacity 300ms cubic-bezier(0.4, 0, 0.2, 1);
      grid-area: 1 / 1;
    }
    .hamburger .icon-x   { transform: rotate(90deg); opacity: 0; }
    .hamburger.open .icon-menu { transform: rotate(-90deg); opacity: 0; }
    .hamburger.open .icon-x    { transform: rotate(0deg);   opacity: 1; }

    /* ===== 移动端菜单 overlay ===== */
    #menuOverlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 400ms ease;
    }
    #menuOverlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    #menuPanel {
      transform: scale(0.97);
      transition: transform 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menuOverlay.open #menuPanel { transform: scale(1); }
    #menuPanel .menu-link,
    #menuPanel .menu-cta {
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 500ms cubic-bezier(0.4, 0, 0.2, 1),
                  transform 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menuOverlay.open #menuPanel .menu-link:nth-child(1) { transition-delay: 100ms; opacity: 1; transform: translateY(0); }
    #menuOverlay.open #menuPanel .menu-link:nth-child(2) { transition-delay: 150ms; opacity: 1; transform: translateY(0); }
    #menuOverlay.open #menuPanel .menu-link:nth-child(3) { transition-delay: 200ms; opacity: 1; transform: translateY(0); }
    #menuOverlay.open #menuPanel .menu-link:nth-child(4) { transition-delay: 250ms; opacity: 1; transform: translateY(0); }
    #menuOverlay.open #menuPanel .menu-cta { transition-delay: 300ms; opacity: 1; transform: scale(1); }

    /* ===== 文字可读性: 白字 + 深色光晕遮罩（不用硬黑边，中文更干净） ===== */
    .hero-heading {
      text-shadow:
        0 2px 18px rgba(0, 0, 0, 0.6),
        0 1px 4px  rgba(0, 0, 0, 0.4);
      -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.6);
    }
    .hero-sub {
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
    }
    /* 英文标语: 斜体衬线点缀 + 轻投影 */
    .english-tagline {
      font-family: 'Instrument Serif', 'Georgia', serif;
      font-style: italic;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
    }

    /* ===== Deep Woods (第 3 视频) 暗色模式 ===== */
    /* hero 主体过渡到 #182C41；标题/副文案保持白字+描边，深色视频下更清晰 */
    #heroBody { transition: color 700ms ease; }
    #heroBody.dark-mode .email-input,
    #heroBody.dark-mode .vtab:not(.active) { color: #182C41; }
    #heroBody.dark-mode .vtab.active { color: #182C41; border-color: #182C41; }
    #heroBody.dark-mode .email-input::placeholder { color: rgba(24, 44, 65, 0.5); }
    #heroBody.dark-mode .hero-heading,
    #heroBody.dark-mode .hero-sub {
      color: #fff;
      text-shadow: 0 0 14px rgba(24, 44, 65, 0.45), 0 0 4px rgba(0, 0, 0, 0.6);
    }
    /* navbar 与底部统计始终白色，不受影响 */
  </style>
</head>

<body class="h-full overflow-hidden bg-black">
  <section class="relative w-full h-screen overflow-hidden bg-black">

    <!-- ═══════════ 背景视频层 (4 个全屏循环视频, 仅激活的显示) ═══════════ -->
    <div class="absolute inset-0" style="z-index:0">
      <video class="video-bg active" src="../first.mp4"  autoplay muted loop playsinline></video>
      <video class="video-bg"       src="../second.mp4" autoplay muted loop playsinline></video>
      <video class="video-bg"       src="../third.mp4"  autoplay muted loop playsinline></video>
      <video class="video-bg"       src="../fourth.mp4" autoplay muted loop playsinline></video>
    </div>

    <!-- ═══════════ 透明 PNG overlay (train-bob 浮动) ═══════════ -->
    <div class="absolute inset-0" style="z-index:1">
      <img class="w-full h-full object-cover train-bob" alt=""
        src="https://soft-zoom-63098134.figma.site/_assets/v11/0b4a435b2df2747593c43d7a1c9b4578f7d8d90c.png">
    </div>

    <!-- ═══════════ 内容层 (z-index 2) ═══════════ -->
    <div class="relative flex flex-col h-full" style="z-index:2">

      <!-- 导航 -->
      <nav class="flex items-center justify-between px-6 py-6 sm:px-10 sm:py-8">
        <a href="#" class="text-white italic serif-accent text-2xl sm:text-3xl tracking-tight">研习室</a>

        <!-- 桌面端导航 -->
        <div class="hidden md:flex items-center gap-1">
          <div class="liquid-glass flex items-center gap-1 rounded-full pl-6 pr-2 py-2">
            <a href="#" class="font-body text-white/90 hover:text-white px-3 py-1 text-sm transition-colors">课程地图</a>
            <a href="#" class="font-body text-white/90 hover:text-white px-3 py-1 text-sm transition-colors">闯关答题</a>
            <a href="#" class="font-body text-white/90 hover:text-white px-3 py-1 text-sm transition-colors">语法手册</a>
            <a href="#" class="font-body text-white/90 hover:text-white px-3 py-1 text-sm transition-colors">关于</a>
            <a href="#" class="font-body ml-2 bg-white text-black rounded-full px-5 py-2 text-sm font-medium transition-transform hover:scale-[1.04]">开始学习</a>
          </div>
        </div>

        <!-- 移动端汉堡按钮 -->
        <button id="menuBtn" aria-label="Menu"
          class="hamburger liquid-glass md:hidden flex items-center justify-center w-11 h-11 rounded-full text-white">
          <span class="grid place-items-center">
            <svg class="icon-menu" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            <svg class="icon-x" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </span>
        </button>
      </nav>

      <!-- 移动端菜单 overlay -->
      <div id="menuOverlay" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center">
        <div id="menuPanel" class="flex flex-col items-center gap-7 px-8 py-10 w-full max-w-sm">
          <a href="#" class="menu-link font-body text-white text-3xl text-center">课程地图</a>
          <a href="#" class="menu-link font-body text-white text-3xl text-center">闯关答题</a>
          <a href="#" class="menu-link font-body text-white text-3xl text-center">语法手册</a>
          <a href="#" class="menu-link font-body text-white text-3xl text-center">关于</a>
          <a href="#" class="menu-cta font-body mt-4 bg-white text-black rounded-full px-8 py-3 text-lg font-medium">开始学习</a>
        </div>
      </div>

      <!-- Hero 主体 (含暗色模式作用域) -->
      <div id="heroBody" class="flex-1 flex flex-col items-center justify-start px-6 text-center pt-[10vh]">

        <!-- Badge: 毛玻璃胶囊标语 -->
        <div class="liquid-glass hero-badge rounded-full px-5 py-2 mb-6 text-white/95 text-xs sm:text-sm font-body tracking-wide"
             style="text-shadow:0 1px 4px rgba(0,0,0,0.6)">
          C 语言 · 英语语法 · 一站学到底
        </div>

        <!-- Heading: 两行上下分布, 第二行右缩进错位 -->
        <h1 class="hero-heading font-body text-white font-extrabold text-3xl sm:text-4xl md:text-5xl lg:text-6xl leading-[1.15] max-w-4xl">
          研习一路风景<br>
          <span class="inline-block pl-10 sm:pl-14 md:pl-16">代码一程征途</span>
        </h1>

        <!-- Subtext: 中文副文案（英文标语已去掉） -->
        <p class="hero-sub font-body text-white/95 mt-5 text-sm sm:text-base md:text-lg max-w-xl leading-relaxed"
           style="text-shadow:0 1px 10px rgba(0,0,0,0.7)">
          窗外是世界的语言，屏前是逻辑的远方。
        </p>

        <!-- Email + CTA -->
        <form class="liquid-glass mt-24 flex items-center rounded-full pl-6 pr-2 py-2 max-w-[320px] sm:max-w-sm w-full"
              onsubmit="return false;">
          <input class="email-input font-body flex-1 bg-transparent text-white placeholder-white/50 outline-none text-sm sm:text-base"
                 type="email" placeholder="你的学习邮箱">
          <button class="font-body shrink-0 bg-white text-black rounded-full px-5 py-2.5 text-sm font-medium transition-transform hover:scale-[1.04]">
            开始旅程
          </button>
        </form>

        <!-- 视频切换器 (简单文字标签, 恢复简洁样式) -->
        <div class="mt-8 flex items-center gap-5 sm:gap-7 font-body text-sm sm:text-base">
          <button class="vtab active pb-1" data-index="0">晨曦</button>
          <button class="vtab pb-1" data-index="1">静水</button>
          <button class="vtab pb-1" data-index="2">深林</button>
          <button class="vtab pb-1" data-index="3">幽谷</button>
        </div>
      </div>

      <!-- 底部四句标语 (桌面显示) -->
      <div class="hidden sm:flex items-center justify-center gap-4 pb-6 font-body text-sm text-white/80">
        <span>英语筑基</span>
        <span class="opacity-40">·</span>
        <span>编程赋能</span>
        <span class="opacity-40">·</span>
        <span>互动精进</span>
        <span class="opacity-40">·</span>
        <span>知行合一</span>
      </div>
    </div>
  </section>

  <script>
    (function () {
      'use strict';

      /* ===== 视频切换 ===== */
      var videos = Array.prototype.slice.call(document.querySelectorAll('.video-bg'));
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.vtab'));
      var heroBody = document.getElementById('heroBody');
      var active = 0;
      var transitioning = false;

      function activate(i) {
        if (i === active || transitioning || i < 0 || i >= videos.length) return;
        transitioning = true;
        videos[active].classList.remove('active');
        videos[i].classList.add('active');
        tabs[active].classList.remove('active');
        tabs[i].classList.add('active');
        // Deep Woods (index 2) → hero 内容进入暗色 #182C41
        heroBody.classList.toggle('dark-mode', i === 2);
        active = i;
        setTimeout(function () { transitioning = false; }, 1000);
      }
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          activate(parseInt(tab.getAttribute('data-index'), 10));
        });
      });

      /* ===== 移动端汉堡菜单 ===== */
      var menuBtn = document.getElementById('menuBtn');
      var menuOverlay = document.getElementById('menuOverlay');
      menuBtn.addEventListener('click', function () {
        var open = menuBtn.classList.toggle('open');
        menuOverlay.classList.toggle('open', open);
      });
      // 点击 overlay 空白处关闭
      menuOverlay.addEventListener('click', function (e) {
        if (e.target === menuOverlay) {
          menuBtn.classList.remove('open');
          menuOverlay.classList.remove('open');
        }
      });
      // 点击链接关闭菜单
      menuOverlay.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () {
          menuBtn.classList.remove('open');
          menuOverlay.classList.remove('open');
        });
      });
    })();
  </script>
</body>
</html>
